<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Service Desk prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F3;--surface:#FFFFFF;--sunk:#E2E7EB;--ink:#1B2A35;--muted:#5B6B77;--line:#D3DAE0;
  --brand:#1F4A63;--brand-ink:#FFFFFF;--action:#F2A900;--action-ink:#1B2A35;
  --good:#2E7D4F;--warn:#A85A00;--bad:#B42318;
  --hvac:#2E6DB4;--elec:#B98000;--plumb:#14857F;--septic:#7B6A33;
  --labor:#5B7FA0;--parts:#C4A76A;--profit:#2E7D4F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11181E;--surface:#1A242C;--sunk:#24313B;--ink:#E6ECF0;--muted:#98A8B3;--line:#2E3C47;
    --brand:#173A4F;--brand-ink:#FFFFFF;--action:#F2B01E;--action-ink:#1B2A35;
    --good:#5CC08A;--warn:#F0A64A;--bad:#F07A6E;
    --hvac:#6FA4E0;--elec:#E7B63A;--plumb:#3CC0B7;--septic:#C2AE6B;
    --labor:#7FA3C4;--parts:#D2B878;--profit:#4FB57E;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11181E;--surface:#1A242C;--sunk:#24313B;--ink:#E6ECF0;--muted:#98A8B3;--line:#2E3C47;
  --brand:#173A4F;--brand-ink:#FFFFFF;--action:#F2B01E;--action-ink:#1B2A35;
  --good:#5CC08A;--warn:#F0A64A;--bad:#F07A6E;
  --hvac:#6FA4E0;--elec:#E7B63A;--plumb:#3CC0B7;--septic:#C2AE6B;
  --labor:#7FA3C4;--parts:#D2B878;--profit:#4FB57E;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--hvac);outline-offset:2px}
.num{font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;font-weight:600;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:12px}
.co{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:21px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:transparent;border:0;color:inherit;width:44px;height:44px;display:grid;place-items:center;border-radius:6px}
.iconbtn:hover{background:rgba(255,255,255,.1)}

main{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:30px;line-height:1.1;margin:4px 0 2px}
h2{font-size:18px;font-weight:700;margin:0 0 4px}
h3{font-size:16px;font-weight:700;margin:0}
.sub{color:var(--muted);margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;margin-top:14px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.back{background:none;border:0;padding:8px 0;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:4px}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:flex;max-width:760px;margin:0 auto}
.nav button{flex:1;background:none;border:0;padding:9px 4px 11px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:62px}
.nav button.on{color:var(--ink);font-weight:700}
.nav button.on svg{color:var(--brand)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav button.on svg{color:var(--action)}}
:root[data-theme="dark"] .nav button.on svg{color:var(--action)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:14px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;font-size:14px;white-space:nowrap;min-height:40px}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;margin-top:12px;padding:12px 14px;border-radius:6px;border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 12%,var(--surface));color:var(--ink);font-weight:600}
.daylabel{margin:22px 0 2px;font-size:15px;font-weight:700;color:var(--muted)}

.job{display:grid;grid-template-columns:6px 70px 1fr;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0;margin-top:8px;overflow:hidden}
.job:hover{border-color:var(--muted)}
.job .stripe{background:var(--tc)}
.job .time{padding:13px 0 12px 12px;font-size:21px;line-height:1.05}
.job .time small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.job .body{padding:12px 12px 12px 2px;min-width:0}
.job .name{display:block;font-weight:700}
.job .desc{display:block;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:13px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--tc)}
.tag::before{content:'';width:9px;height:9px;border-radius:2px;background:var(--tc)}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill.progress{background:color-mix(in srgb,var(--hvac) 16%,var(--surface));color:var(--hvac)}
.pill.parts{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.pill.invoiced{background:color-mix(in srgb,var(--labor) 18%,var(--surface))}
.pill.paid{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}

.btn{font-weight:700;border-radius:6px;border:1px solid var(--line);background:var(--surface);padding:11px 18px;min-height:48px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--action);border-color:var(--action);color:var(--action-ink)}
.btn.dark{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn.slim{min-height:40px;padding:7px 14px;font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.actions .btn{flex:1 1 150px}

.jobhead{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--tc);border-radius:6px;padding:16px;margin-top:6px}
.dl{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:6px 14px;margin:8px 0 0;font-size:15px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.callout{margin-top:10px;padding:10px 12px;border-radius:6px;background:var(--sunk);font-size:15px}
.callout.warn{background:color-mix(in srgb,var(--warn) 13%,var(--surface))}
a{color:var(--hvac);font-weight:600}

.check{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-of-type{border-top:0}
.check input{width:24px;height:24px;margin:0;accent-color:var(--good);flex:none}
.check.done span{color:var(--muted);text-decoration:line-through}
.progressline{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin:6px 0 4px}
.progressline span{display:block;height:100%;background:var(--good)}

.line{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .nm{font-weight:700}
.line .inc{font-size:13px;color:var(--muted)}
.line .amt{font-size:21px;text-align:right}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.stepper button{width:40px;height:36px;border:0;background:var(--sunk);font-size:18px;font-weight:700}
.stepper span{min-width:36px;text-align:center;font-weight:700}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);margin-top:6px;padding-top:10px}
.total .num{font-size:30px}
.empty{padding:14px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);text-align:center;margin:6px 0}

.split{display:flex;height:16px;border-radius:3px;overflow:hidden;background:var(--sunk);margin:10px 0 8px}
.split span{display:block;height:100%}
.split .l{background:var(--labor)}.split .p{background:var(--parts)}.split .g{background:var(--profit)}
.legend{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px}
.legend .k{display:flex;align-items:center;gap:8px}
.legend .k i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend .v{text-align:right;font-size:18px}
.gp{font-weight:700}
.neg{color:var(--bad)}

.bigread{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bigread .num{font-size:46px;line-height:1}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px;margin-top:10px}
.statgrid div{min-width:0}
.statgrid .lab{font-size:13px;color:var(--muted)}
.statgrid .num{font-size:21px;display:block}
@media (max-width:420px){.statgrid{grid-template-columns:repeat(2,1fr)}}
.ratio{margin-top:10px;padding:10px 12px;border-radius:6px;background:var(--sunk);font-size:15px}
.ratio .num{font-size:20px}

.tablewrap{overflow-x:auto;margin-top:6px}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:460px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}

.pbrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:13px 2px}
.pbrow:first-child{border-top:0}
.pbrow .price{font-size:24px;text-align:right}

label.f{display:block;margin-top:13px;font-size:14px;font-weight:700}
input,select,textarea{display:block;width:100%;margin-top:5px;font:inherit;font-weight:400;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-height:48px}
textarea{min-height:88px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:460px){.grid2{grid-template-columns:1fr}}
.inlineadd{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:end;margin-top:8px}
.inlineadd input{margin-top:0}

.tradepick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tradepick button{border:2px solid var(--line);background:var(--surface);border-radius:6px;padding:16px 12px;text-align:left;font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px;min-height:64px}
.tradepick button i{width:14px;height:14px;border-radius:3px;background:var(--tc);flex:none}
.tradepick button.on{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,var(--surface))}

.scrim{position:fixed;inset:0;background:rgba(8,16,22,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:90vh;max-height:90dvh;overflow:auto;border-radius:12px 12px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:10px}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.pick{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px}
.pick .price{font-size:22px}
.pick .cnt{font-size:12px;font-weight:700;color:var(--good)}
.email{border:1px solid var(--line);border-radius:6px;padding:14px;margin-top:10px;font-size:15px;background:var(--bg)}
.email .reviewbtn{display:inline-block;margin-top:8px;background:var(--action);color:var(--action-ink);padding:9px 14px;border-radius:6px;text-decoration:none;font-weight:700}

.inv{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 18px;margin-top:10px;position:relative}
.inv-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
.inv-top .num{font-size:26px}
.inv .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;font-size:15px}
@media (max-width:460px){.inv .cols{grid-template-columns:1fr}}
.inv .cols .lab{font-size:13px;color:var(--muted);font-weight:600}
.stamp{position:absolute;top:70px;right:18px;transform:rotate(-8deg);border:3px solid var(--good);color:var(--good);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;padding:2px 12px;border-radius:4px;opacity:.9}
.toggle{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:600}
.toggle input{width:22px;height:22px;min-height:0;margin:0;accent-color:var(--brand)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:6px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.nav button{font-size:12px}
.weeknav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.weeknav .btn{min-height:42px;padding:8px 14px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.strip button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 2px 7px;text-align:center;min-height:64px}
.strip button .dw{display:block;font-size:12px;color:var(--muted)}
.strip button .dn{display:block;font-size:22px;line-height:1.1}
.strip button .dc{display:block;font-size:11px;color:var(--muted);min-height:14px}
.strip button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.strip button.on .dw,.strip button.on .dc{color:inherit;opacity:.8}
.strip button.today:not(.on){border-color:var(--action);border-width:2px}
.techblock{margin-top:18px}
.techblock-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.opengap{margin-top:8px;padding:10px 12px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:14px}
.pill.enroute{background:color-mix(in srgb,var(--action) 25%,var(--surface));color:var(--ink)}
.contact{display:flex;gap:10px;margin-top:14px}
.contact .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px}
.officeline{font-size:13px;color:var(--muted);margin-top:6px}
.private{border:1px solid color-mix(in srgb,var(--brand) 40%,var(--line));background:color-mix(in srgb,var(--brand) 7%,var(--surface))}
.note{padding:10px 0;border-top:1px solid var(--line)}
.note:first-of-type{border-top:0}
.note .by{font-size:13px;color:var(--muted);font-weight:600}
.bubbles{display:flex;flex-direction:column;gap:8px;margin:10px 0;max-height:46vh;overflow:auto;padding:4px 2px}
.bub{max-width:82%;padding:9px 12px;border-radius:12px;font-size:15px}
.bub.out{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:3px}
.bub.in{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:3px}
.bub.sys{align-self:center;background:none;color:var(--muted);font-size:13px;padding:2px}
.bub .ts{display:block;font-size:11px;opacity:.75;margin-top:3px}
.clockcard{text-align:center;padding:26px 16px}
.clockcard .big{font-size:56px;line-height:1}
.clockcard .btn{min-height:64px;font-size:20px;width:100%;max-width:360px;margin-top:16px}
.invrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px}
.invrow:first-child{border-top:0}
.invrow .oh{font-size:26px;text-align:right;line-height:1}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--good) 14%,var(--surface));color:var(--good);margin-top:10px}
.badge.off{background:var(--sunk);color:var(--muted)}
.summarybox{margin-top:14px;padding:12px 14px;border-left:4px solid var(--brand);background:var(--sunk);border-radius:0 6px 6px 0;font-size:15px;white-space:pre-wrap}
.topbtns{display:flex;gap:2px}

.nav button{font-size:11px;padding-left:1px;padding-right:1px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;min-height:42px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--surface)}
.dx{color:var(--bad);font-weight:800}
.strip button.on .dx{color:var(--action)}
main.wide{max-width:1400px}
.board{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);margin-top:12px}
.board-in{display:grid;grid-template-columns:58px repeat(var(--cols),minmax(150px,1fr));min-width:calc(58px + var(--cols) * 150px)}
.bcorner,.bgut{position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--line)}
.bh{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);text-align:center;min-width:0}
.bcorner{border-bottom:1px solid var(--line)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--tc);color:#fff;font-weight:700;font-size:14px}
.bn{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bm{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.bm i.on{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.bgut{position:sticky;left:0}
.bgut span{position:absolute;right:6px;font-size:12px;color:var(--muted);transform:translateY(-1px)}
.bcol{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--line) 45%,transparent) 1px,transparent 1px);background-size:100% 56px,100% 28px;cursor:copy}
.bcol.over{background-color:color-mix(in srgb,var(--action) 10%,var(--surface))}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2;pointer-events:none}
.blk{position:absolute;left:calc(var(--lane) * (100% / var(--lanes)) + 3px);width:calc(100% / var(--lanes) - 6px);display:flex;flex-direction:column;gap:1px;align-items:flex-start;text-align:left;overflow:hidden;padding:5px 7px;border:1px solid color-mix(in srgb,var(--tc) 30%,var(--line));border-left:4px solid var(--tc);border-radius:4px;background:color-mix(in srgb,var(--tc) 13%,var(--surface));font-size:12.5px;line-height:1.25;z-index:1;cursor:pointer}
.blk strong{font-size:13.5px;overflow-wrap:anywhere}
.blk .num{font-size:15px}
.blk .bs{font-size:11px;font-weight:700;color:var(--muted)}
.blk.parts{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--warn) 14%,var(--surface)) 0 8px,var(--surface) 8px 16px);border-style:dashed}
.blk.parts .bs{color:var(--warn)}
.blk.invoiced,.blk.paid{opacity:.62}
.blk.progress .bs,.blk.enroute .bs{color:var(--ink)}
.blk.conflict{outline:2px solid var(--bad);outline-offset:-1px}
.blk.conflict .bs{color:var(--bad)}
.blk.dragging{opacity:.4}
.blk:focus-visible{z-index:4}

.eqcard{display:grid;grid-template-columns:72px 1fr;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;align-items:start}
.eqcard:first-of-type{border-top:0}
.eqcard img,.eqcard .eqph{width:72px;height:72px;border-radius:6px;object-fit:cover;border:1px solid var(--line)}
.eqph{display:grid;place-items:center;background:var(--sunk);color:var(--muted);font-size:11px;text-align:center}
.eqb{display:flex;flex-direction:column;gap:1px;min-width:0;border-left:3px solid var(--tc);padding-left:10px}
.eqphoto{display:flex;align-items:center;gap:12px;margin-top:6px}
.eqphoto img,.eqphoto .eqph{width:96px;height:96px;border-radius:6px;object-fit:cover;border:1px solid var(--line)}

.subrow{padding-left:22px;background:color-mix(in srgb,var(--sunk) 45%,transparent)}
.pill.mem{background:color-mix(in srgb,var(--action) 28%,var(--surface));color:var(--ink)}
.memcard{border:1px solid var(--line);border-radius:6px;padding:14px;margin-top:10px}
.memcard:first-of-type{margin-top:4px}
.plangrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:8px}
.plancard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--action);border-radius:6px;padding:14px}
.plancard:hover{border-color:var(--muted)}
details.loc{border-top:1px solid var(--line)}
details.loc:first-of-type{border-top:0}
details.loc summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 2px;cursor:pointer;list-style:none}
details.loc summary::-webkit-details-marker{display:none}
details.loc summary::after{content:'+';font-weight:700;font-size:20px;color:var(--muted);margin-left:6px}
details.loc[open] summary::after{content:'–'}
.locbody{padding:0 2px 14px}
.visitedit{display:grid;grid-template-columns:1.3fr .7fr 1.4fr auto;gap:6px;margin-top:8px;align-items:center}
.visitedit input,.visitedit select{margin-top:0;min-height:42px;font-size:14px}
@media (max-width:560px){.visitedit{grid-template-columns:1fr 1fr}.visitedit input{grid-column:1/-1}}

.co img{height:34px;width:auto;max-width:120px;object-fit:contain;background:#fff;border-radius:4px;padding:2px 4px;vertical-align:middle;margin-right:10px}
.invlogo{display:block;max-height:70px;max-width:220px;object-fit:contain;margin-bottom:6px}
.mlogo{display:block;max-height:40px;max-width:160px;object-fit:contain;margin-bottom:4px}
.mailbrand{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
.logoprev{width:140px;height:70px;border:1px dashed var(--line);border-radius:6px;display:grid;place-items:center;background:#fff;overflow:hidden}
.logoprev img{max-width:100%;max-height:100%;object-fit:contain}
.paygrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.paygrid button{border:2px solid var(--line);background:var(--surface);border-radius:6px;padding:12px 10px;min-height:52px;font-weight:600;text-align:left}
.paygrid button.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface))}
.paygrid button:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="co" id="coName">Service Desk</div>
<div class="topbtns">
<button class="iconbtn" data-act="newjob" aria-label="New job"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<button class="iconbtn" data-act="settings" aria-label="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div></div></header>
<main id="app"></main>
<nav class="nav" aria-label="Main"><div class="nav-in">
<button data-act="go" data-go="schedule"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Schedule</button>
<button data-act="go" data-go="customers"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1"/><path d="M17 4a4 4 0 0 1 0 8M22 21v-1a6 6 0 0 0-3-5.2"/></svg>Customers</button>
<button data-act="go" data-go="clock"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Clock</button>
<button data-act="go" data-go="pricebook"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>Prices</button>
<button data-act="go" data-go="inventory"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>Stock</button>
<button data-act="go" data-go="reports"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</button>
</div></nav>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const KEY='svcdesk-flatrate-v7';
const TR={hvac:{name:'HVAC',color:'var(--hvac)'},electrical:{name:'Electrical',color:'var(--elec)'},plumbing:{name:'Plumbing',color:'var(--plumb)'},septic:{name:'Septic',color:'var(--septic)'}};
const TK=['hvac','electrical','plumbing','septic'];
const SITE={
 hvac:[{k:'system',l:'System type',o:['Split AC','Heat pump','Package unit','Gas furnace','Mini-split']},{k:'brand',l:'Brand'},{k:'age',l:'Approx. age (years)',t:'number'},{k:'tonnage',l:'Tonnage',o:['1.5','2','2.5','3','3.5','4','5']},{k:'filter',l:'Filter size'},{k:'thermostat',l:'Thermostat'}],
 electrical:[{k:'panelBrand',l:'Panel brand'},{k:'panelAmps',l:'Panel amps',o:['100','125','150','200','400']},{k:'issueLocation',l:'Where is the issue?'},{k:'permit',l:'Permit likely?',o:['No','Yes','Not sure']},{k:'gensolar',l:'Generator or solar?',o:['None','Generator','Solar','Both']}],
 plumbing:[{k:'whType',l:'Water heater type',o:['Gas tank','Electric tank','Tankless gas','Tankless electric']},{k:'whAge',l:'Water heater age (years)',t:'number'},{k:'shutoff',l:'Main shutoff location'},{k:'pipe',l:'Pipe material',o:['Copper','PEX','CPVC','Galvanized','Unknown']},{k:'fixture',l:'Fixture involved'}],
 septic:[{k:'tankSize',l:'Tank size (gallons)',o:['750','1000','1250','1500','2000']},{k:'tankMaterial',l:'Tank material',o:['Concrete','Poly','Fiberglass','Steel']},{k:'tankLocation',l:'Tank location'},{k:'lidDepth',l:'Lid depth (inches)',t:'number'},{k:'riser',l:'Riser installed?',o:['No','Yes']},{k:'lastPumped',l:'Last pumped',t:'date'},{k:'drainField',l:'Drain field notes'}]
};
const CHECK={
 hvac:['Check thermostat operation','Inspect filter and replace if dirty','Test capacitor and contactor','Check refrigerant pressures','Rinse condenser coil','Flush condensate drain','Record supply and return temperatures'],
 electrical:['Shut off and lock out circuit before work','Test outlets and GFCI protection','Check panel for heat, corrosion, or loose lugs','Verify breaker and wire sizing match','Label any circuits changed','Test circuit after repair with customer'],
 plumbing:['Locate main shutoff before work','Inspect for active leaks','Test water pressure','Check water heater T&P valve','Run fixtures after repair and check for leaks','Clean up work area'],
 septic:['Locate and expose tank lids','Record sludge and scum levels','Inspect inlet and outlet baffles','Check effluent filter','Walk drain field for pooling or odor','Record gallons pumped','Secure lids and replace cover soil']
};
const FOLLOW={hvac:{d:180,l:'Seasonal tune-up reminder'},electrical:{d:365,l:'Annual electrical safety check'},plumbing:{d:365,l:'Annual plumbing check and water heater flush'},septic:{d:1095,l:'Septic pump-out reminder'}};
const EQ={
 hvac:{types:['AC/heat unit','Condenser','Heat pump','Furnace','Air handler','Package unit','Mini-split','Wall unit','Window AC','Evaporative cooler','Exhaust fan','Gas unit heater','Evaporator coil','Thermostat'],size:'Size (tons or BTU)',sizePh:'3 ton, 80,000 BTU',extra:{k:'refrigerant',l:'Refrigerant',o:['R-410A','R-454B','R-32','R-22','Other']}},
 electrical:{types:['Main panel','Subpanel','Meter base','Generator','Transfer switch','Solar inverter','EV charger','Surge protector'],size:'Amps or kW',sizePh:'200A, 40 spaces',extra:{k:'breakers',l:'Breaker type',o:['Plug-on','Bolt-on','Mixed','Unknown']}},
 plumbing:{types:['Water heater','Tankless water heater','Water softener','Filtration system','Pressure regulator','Sump pump','Well pump','Recirculation pump'],size:'Capacity',sizePh:'50 gal, 199k BTU',extra:{k:'fuel',l:'Fuel or power',o:['Natural gas','Propane','Electric','N/A']}},
 septic:{types:['Septic tank','Pump or lift station','Effluent filter','Alarm panel','Aerobic unit','Distribution box','Drain field'],size:'Capacity or size',sizePh:'1,250 gal',extra:{k:'material',l:'Material',o:['Concrete','Poly','Fiberglass','Steel','N/A']}}
};
const COND=['Good','Fair','Poor','Needs replacement'];
const TERMS={due:{l:'Due on receipt',d:0},net15:{l:'Net 15',d:15},net30:{l:'Net 30',d:30},net60:{l:'Net 60',d:60}};
const STATUS={scheduled:'Scheduled',enroute:'On the way',progress:'In progress',parts:'Waiting on parts',invoiced:'Invoiced',paid:'Paid'};
const OPEN=['scheduled','enroute','progress','parts'];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(n,d=0)=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=n=>isFinite(n)?Math.round(n*100)+'%':'–';
const r1=n=>Math.round(n*10)/10;
function iso(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
const today=()=>iso(new Date());
function toDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const x=toDate(s);x.setDate(x.getDate()+n);return iso(x)}
function daysBetween(a,b){return Math.round((toDate(b)-toDate(a))/86400000)}
function weekStart(s){const dow=(toDate(s).getDay()+6)%7;return addDays(s,-dow)}
function fmtDate(s){if(!s)return'';const x=toDate(s),o={month:'short',day:'numeric'};if(x.getFullYear()!==new Date().getFullYear())o.year='numeric';return x.toLocaleDateString('en-US',o)}
function fmtTime(t){if(!t)return'';let[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(m).padStart(2,'0')}<small>${ap}</small>`}
const fmtTimePlain=t=>fmtTime(t).replace('<small>',' ').replace('</small>','');
function dayLabel(d){const n=daysBetween(today(),d);if(n===0)return'Today';if(n===1)return'Tomorrow';if(n===-1)return'Yesterday';return toDate(d).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}
function stamp(dt){dt=dt||new Date();return iso(dt)+'T'+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0')}
function parseStamp(s){const[a,b]=s.split('T'),x=toDate(a),[h,mi]=b.split(':').map(Number);x.setHours(h,mi,0,0);return x}
const stampTime=s=>fmtTimePlain(s.split('T')[1]);
function stampLabel(s){const d=s.split('T')[0];return(d===today()?'Today':fmtDate(d))+', '+stampTime(s)}
const punchHours=p=>Math.max(0,((p.out?parseStamp(p.out):new Date())-parseStamp(p.in))/3600000);
const first=n=>String(n||'').split(' ')[0];

let state,view={name:'schedule'},ui={trade:'all',onlyParts:false,day:null,pbTrade:'hvac',invTrade:'all',invQ:'',period:30,sheet:null,resetArm:false,me:'t1',mode:(window.innerWidth>=760?'board':'list'),custQ:'',custF:'all'},intake=null;
const pb=id=>state.pricebook.find(p=>p.id===id);
const tech=id=>state.techs.find(t=>t.id===id)||{name:'Unassigned',rate:0,trade:''};
const cust=id=>state.customers.find(c=>c.id===id)||{name:'Unknown customer',site:{}};
const job=id=>state.jobs.find(j=>j.id===id);
const item=id=>state.inventory.find(i=>i.id===id);
const uid=p=>p+(state.nextId++);
const lp=(l,p)=>l.price!=null?l.price:p.price;
const cardUp=()=>1/(1-(+state.cardCover||0)/100);
function calcPrice(p){return Math.round(((+p.hours||0)*state.laborRate+(+p.parts||0)*(1+state.partsMarkup/100))*cardUp())}
function repriceAll(){state.pricebook.forEach(p=>{if(p.mode!=='custom')p.price=calcPrice(p)})}
function avgRate(trade){const t=state.techs.filter(x=>x.trade===trade);return t.length?t.reduce((s,x)=>s+Number(x.rate),0)/t.length:40}

/* payments */
const PM={tap:'Tap to Pay on phone',reader:'Card reader',link:'Text-to-pay link',file:'Card on file',ach:'Bank transfer (ACH)',check:'Check',cash:'Cash'};
const paidAmt=j=>((j.invoice&&j.invoice.payments)||[]).reduce((x,p)=>x+p.amount,0);
const balance=j=>j.status==='paid'?0:Math.max(0,Math.round((nums(j).billed-paidAmt(j))*100)/100);
function cardFee(m,a){if(m==='tap'||m==='reader')return Math.round((a*state.fees.inPct/100+state.fees.inFix+(m==='tap'?state.fees.tap:0))*100)/100;if(m==='link'||m==='file')return Math.round((a*state.fees.onPct/100+state.fees.onFix)*100)/100;if(m==='ach')return Math.min(state.fees.achCap,Math.round(a*state.fees.achPct)/100);return 0}
function brandHead(big){return `${state.logo?`<img class="${big?'invlogo':'mlogo'}" src="${state.logo}" alt="${esc(state.company)} logo">`:''}<div class="co" style="font-size:${big?24:18}px">${esc(state.company)}</div>`}

/* customers: locations, sub-accounts, memberships */
const locOf=(c,lid)=>lid?(c.locations||[]).find(l=>l.id===lid):null;
const kids=cid=>state.customers.filter(x=>x.parentId===cid);
const billCust=c=>c.parentId&&c.billTo==='parent'?cust(c.parentId):c;
function jobName(j){const c=cust(j.customerId),l=locOf(c,j.locId);return c.name+(l?', '+l.name:'')}
function jobAddr(j){const c=cust(j.customerId),l=locOf(c,j.locId);return l?l.address:c.address}
const planOf=id=>state.plans.find(p=>p.id===id)||{name:'Unknown plan',discount:0,visits:[],price:0,billing:'year'};
const shortPlan=pl=>pl.name.replace(/^Alpha /,'').replace(/ Comfort [Pp]lan$/,'');
function memFor(cid,date){date=date||today();const c=cust(cid),live=m=>m.start<=date&&date<=m.end&&!m.cancelled;
  return state.memberships.find(m=>m.customerId===cid&&live(m))||(c.parentId?state.memberships.find(m=>m.customerId===c.parentId&&m.coverSubs&&live(m)):null)||null}
function addMonths(s,n){const x=toDate(s);x.setMonth(x.getMonth()+n);return iso(x)}
const HVAC_SKIP=['Thermostat','Evaporator coil','Air handler'];
function unitsFor(m){let hvac=0,wh=0;(m.targets||[]).forEach(t=>{const c=cust(t.cid);(c.equipment||[]).filter(e=>!t.locId||e.locId===t.locId).forEach(e=>{if(e.trade==='hvac'&&!HVAC_SKIP.includes(e.type))hvac++;if(e.trade==='plumbing'&&/water heater/i.test(e.type))wh++})});return{hvac,wh}}
function contractPrice(m){const pl=planOf(m.planId);if(m.price!=null&&m.price!=='')return +m.price;let x=pl.price;if(pl.included){const u=unitsFor(m);x+=Math.max(0,u.hvac-pl.included.hvac)*pl.addonHvac+Math.max(0,u.wh-pl.included.wh)*pl.addonWh}return x}
const annual=m=>{const pl=planOf(m.planId);return contractPrice(m)*(pl.billing==='month'?12:1)};
const BILL={year:'every year',month:'every month',once:'one-time payment per year'};
function visitStatus(v){if(v.doneDate)return'done';const j=v.jobId&&job(v.jobId);if(j)return j.invoice?'done':'scheduled';return v.due<today()?'overdue':'due'}
function genVisits(m,nid){const pl=planOf(m.planId);m.visits=[];pl.visits.forEach((v,vi)=>m.targets.forEach(t=>m.visits.push({id:nid(),vi,label:v.label,trade:v.trade,tasks:v.tasks.slice(),due:addMonths(m.start,v.mo),cid:t.cid,locId:t.locId||null,jobId:null,doneDate:null})))}
function makeTargets(c,locIds,coverSubs){const t=[];if(c.locations&&c.locations.length&&locIds&&locIds.length)locIds.forEach(l=>t.push({cid:c.id,locId:l}));else t.push({cid:c.id,locId:null});if(coverSubs)kids(c.id).forEach(k=>t.push({cid:k.id,locId:null}));return t}

/* job costing: actual hours and logged materials win over price book estimates */
function nums(j){
  let billed=0,est=0,std=0;
  let elig=0,diag=0;
  j.tasks.forEach(l=>{const p=pb(l.id);if(!p)return;const amt=(l.incl?0:lp(l,p))*l.qty;billed+=amt;if(!l.incl){elig+=amt;if(/diagnostic/i.test(p.name))diag+=amt}est+=p.parts*l.qty;std+=p.hours*l.qty});
  const mem=memFor(j.customerId,j.date),pl=mem&&planOf(mem.planId);let disc=0,freeD=0;
  if(pl){freeD=pl.freeDiag?diag:0;disc=Math.round((freeD+(elig-freeD)*pl.discount/100)*100)/100}
  const gross=billed;billed=gross-disc;
  const logged=j.materials.reduce((s,x)=>s+(+x.cost||0)*(+x.qty||1),0);
  const partsActual=j.materials.length>0,parts=partsActual?logged:est;
  const hours=j.hours==null?std:Number(j.hours);
  const labor=hours*Number(tech(j.techId).rate||0);
  return{billed,gross,disc,freeD,plan:pl?shortPlan(pl):'',pctOff:pl?pl.discount:0,parts,partsActual,est,labor,hours,std,gp:billed-parts-labor};
}
function costBar(b,l,p){const tot=Math.max(b,l+p)||1,g=Math.max(b-l-p,0);return `<div class="split" role="img" aria-label="Labor ${money(l)}, parts ${money(p)}, gross profit ${money(b-l-p)}"><span class="l" style="width:${l/tot*100}%"></span><span class="p" style="width:${p/tot*100}%"></span><span class="g" style="width:${g/tot*100}%"></span></div>`}
function legend(b,l,p,ln,pn){const g=b-l-p;return `<div class="legend">
<span class="k">Billed to customer</span><span class="v num">${money(b)}</span>
<span class="k"><i style="background:var(--labor)"></i>Labor${ln?` <span class="muted small">${ln}</span>`:''}</span><span class="v num">${money(l)}</span>
<span class="k"><i style="background:var(--parts)"></i>Parts and materials${pn?` <span class="muted small">${pn}</span>`:''}</span><span class="v num">${money(p)}</span>
<span class="k gp"><i style="background:var(--profit)"></i>Gross profit</span><span class="v num gp ${g<0?'neg':''}">${money(g)} <span class="small">${b?pct(g/b):''}</span></span></div>`}

/* ---------- seed data ---------- */

    <div class="cols">
      <div><div class="lab">Bill to</div>${esc(bc.name)}<br>${esc(bc.billing||bc.address)}</div>

      <div><div class="lab">Terms</div>${paid?TERMS[inv.terms].l:`<select data-chg="terms" data-id="${j.id}" aria-label="Payment terms" style="margin-top:2px">${Object.entries(TERMS).map(([k,v])=>`<option value="${k}" ${inv.terms===k?'selected':''}>${v.l}</option>`).join('')}</select>`}</div>

    ${j.tasks.map(l=>{const p=pb(l.id);if(!p)return'';return `<tr><td style="white-space:normal"><strong>${esc(p.name)}</strong><br><span class="muted small">${esc(p.includes)}</span></td><td class="r">${l.qty}</td><td class="r">${l.incl?'Included':money(lp(l,p),2)}</td><td class="r">${l.incl?'$0.00':money(lp(l,p)*l.qty,2)}</td></tr>`}).join('')}
    ${n.disc?`<tr><td colspan="3">Subtotal</td><td class="r">${money(n.gross,2)}</td></tr><tr><td colspan="3" style="white-space:normal;color:var(--good)"><strong>${esc(n.plan)} member savings</strong> (${n.freeD?'free diagnostic, ':''}${n.pctOff}% off)</td><td class="r" style="color:var(--good)">-${money(n.disc,2)}</td></tr>`:''}

/* ---------- intake ---------- */
function newDraft(){return{trade:null,customerId:'new',cust:{name:'',type:'Residential',phone:'',email:'',address:'',billing:'',terms:'due',access:'',source:'Google'},site:{},job:{desc:'',loc:'',date:ui.day&&ui.day>=today()?ui.day:today(),time:'08:00',techId:'',note:'',dur:'3'}}}
const DURS=[['1','1 hour'],['1.5','1.5 hours'],['2','2 hours'],['3','3 hours'],['4','4 hours'],['6','6 hours'],['8','All day']];
function fld(g,k,label,val,type,opts,extra){const id='i_'+g+'_'+k;
  if(opts)return `<label class="f" for="${id}">${label}</label><select id="${id}" data-g="${g}" data-k="${k}"><option value="">Select</option>${opts.map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(val)===String(v)?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;
  if(type==='textarea')return `<label class="f" for="${id}">${label}</label><textarea id="${id}" data-g="${g}" data-k="${k}" ${extra||''}>${esc(val)}</textarea>`;
  return `<label class="f" for="${id}">${label}</label><input id="${id}" type="${type||'text'}" data-g="${g}" data-k="${k}" value="${esc(val)}" ${extra||''}>`}
function syncIntake(){if(!intake)return;document.querySelectorAll('#app [data-g]').forEach(el=>{const g=el.dataset.g,k=el.dataset.k;if(g==='root')intake[k]=el.value;else if(intake[g])intake[g][k]=el.value})}

  if(ex)h+=`<dl class="dl" style="margin-top:12px"><dt>Address</dt><dd>${esc(ex.address)}</dd><dt>Phone</dt><dd>${esc(ex.phone)}</dd><dt>Terms</dt><dd>${TERMS[ex.terms].l}</dd>${ex.access?`<dt>Access notes</dt><dd>${esc(ex.access)}</dd>`:''}</dl>`;
  else{const c=d.cust;h+=fld('cust','name','Name or company',c.name,'text',null,'autocomplete="name"')+`<div class="grid2">${fld('cust','type','Customer type',c.type,null,['Residential','Commercial'])}${fld('cust','terms','Payment terms',c.terms,null,Object.entries(TERMS).map(([k,v])=>[k,v.l]))}</div>

    ${fld('cust','access','Access notes',c.access,'text',null,'placeholder="Gate code, pets, parking"')}${fld('cust','source','How did they hear about us?',c.source,null,['Google','Referral','Repeat customer','Facebook','Yard sign','Truck wrap','Other'])}`}

  const base=ex?((ex.site||{})[d.trade]||{}):{};

  <div class="grid2">${fld('job','dur','Arrival window',d.job.dur,null,DURS)}${fld('job','techId','Assign tech',tId,null,[...trT,...oth].map(t=>[t.id,t.name+(t.trade!==d.trade?` (${TR[t.trade].name})`:'')]).concat([['none','Unassigned']]))}</div><div id="iWarn"></div></section>

  <button class="btn primary block" style="margin-top:18px" data-act="isave">Create and schedule job</button></section>`;
  return h;
}

/* ---------- time clock ---------- */
function viewClock(){
  const me=tech(ui.me),op=openPunch(ui.me),ws=weekStart(today());
  const mine=state.punches.filter(p=>p.techId===ui.me&&p.in.slice(0,10)>=ws).sort((a,b)=>b.in.localeCompare(a.in));
  const wkHrs=mine.reduce((s,p)=>s+punchHours(p),0);
  let h=`<h1>Time clock</h1><p class="sub">Clock hours drive payroll cost in Reports, so you can compare what each tech bills with what you pay them.</p>
  <label class="f" for="me">Who is clocking in?</label><select id="me" data-chg="me">${state.techs.map(t=>`<option value="${t.id}" ${t.id===ui.me?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
  <section class="panel clockcard">${op?`<div class="muted">Clocked in since ${stampTime(op.in)}</div><div class="big num">${r1(punchHours(op))} hr</div><button class="btn dark" data-act="clock-out">Clock out</button>`
    :`<div class="muted">${esc(first(me.name))} is clocked out</div><div class="big num">${new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</div><button class="btn primary" data-act="clock-in">Clock in</button>`}</section>
  <section class="panel"><div class="panel-head"><h2>${esc(first(me.name))}'s week</h2><span class="num" style="font-size:20px">${r1(wkHrs)} hr</span></div>
  ${mine.length?`<div class="tablewrap"><table style="min-width:320px"><thead><tr><th>Day</th><th>In</th><th>Out</th><th class="r">Hours</th></tr></thead><tbody>${mine.map(p=>`<tr><td>${dayLabel(p.in.slice(0,10))}</td><td>${stampTime(p.in)}</td><td>${p.out?stampTime(p.out):'<span class="pill progress">On the clock</span>'}</td><td class="r">${r1(punchHours(p))}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No time this week yet.</div>`}
  <p class="sub small" style="margin-top:8px">Pay this week at ${money(me.rate)}/hr loaded cost: <strong>${money(wkHrs*me.rate)}</strong></p></section>
  <h2 style="margin-top:22px">Team timesheet, this week</h2><section class="panel" style="padding-top:6px"><div class="tablewrap"><table><thead><tr><th>Tech</th><th>Right now</th><th class="r">Hours</th><th class="r">Labor cost</th><th class="r">Billed</th></tr></thead><tbody>
  ${state.techs.map(t=>{const ps=state.punches.filter(p=>p.techId===t.id&&p.in.slice(0,10)>=ws),hr=ps.reduce((s,p)=>s+punchHours(p),0),o=openPunch(t.id),billed=state.jobs.filter(j=>j.techId===t.id&&j.invoice&&j.invoice.date>=ws).reduce((s,j)=>s+nums(j).billed,0);
    return `<tr><td>${esc(t.name)}</td><td>${o?`<span class="pill progress">In since ${stampTime(o.in)}</span>`:'<span class="pill">Out</span>'}</td><td class="r">${r1(hr)}</td><td class="r">${money(hr*t.rate)}</td><td class="r">${money(billed)}</td></tr>`}).join('')}</tbody></table></div></section>`;
  return h;
}

/* ---------- reports ---------- */
function viewReports(){
  const from=addDays(today(),-ui.period),js=state.jobs.filter(j=>j.invoice&&j.invoice.date>=from);
  const sum=a=>a.reduce((s,j)=>{const n=nums(j);s.b+=n.billed;s.l+=n.labor;s.p+=n.parts;s.h+=n.hours;s.c++;return s},{b:0,l:0,p:0,h:0,c:0});
  const paidH=tid=>state.punches.filter(p=>(!tid||p.techId===tid)&&p.in.slice(0,10)>=from).reduce((s,p)=>s+punchHours(p),0);
  const payroll=state.techs.reduce((s,t)=>s+paidH(t.id)*t.rate,0);
  const T=sum(js),gp=T.b-T.l-T.p;
  let h=`<h1>Reports</h1><p class="sub">What each job and tech billed compared with what they cost you.</p>
  <div class="chips">${[7,30,90].map(p=>`<button class="chip ${ui.period===p?'on':''}" data-act="period" data-v="${p}">Last ${p} days</button>`).join('')}</div>
  <section class="panel"><div class="muted small">Gross profit on jobs, last ${ui.period} days</div><div class="bigread"><span class="num ${gp<0?'neg':''}">${money(gp)}</span><span class="muted">${T.b?pct(gp/T.b):''} of ${money(T.b)} billed across ${T.c} jobs</span></div>
  ${costBar(T.b,T.l,T.p)}${legend(T.b,T.l,T.p,`${r1(T.h)} job hr`)}
  <div class="ratio">Total payroll from the time clock: <span class="num">${money(payroll)}</span>. You billed <span class="num">${money(payroll?T.b/payroll:0,2)}</span> for every $1.00 of payroll.</div></section>
  <h2 style="margin-top:22px">Billed vs. paid, by technician</h2><p class="sub small">Paid is time clock hours times each tech's loaded hourly cost (wages, taxes, benefits), set in Settings. Billable time is job hours divided by clocked hours.</p>`;
  state.techs.map(t=>({t,s:sum(js.filter(j=>j.techId===t.id)),ph:paidH(t.id)})).sort((a,b)=>(b.s.b-b.ph*b.t.rate)-(a.s.b-a.ph*a.t.rate)).forEach(({t,s,ph})=>{const paid=ph*t.rate,g=s.b-s.l-s.p;
    h+=`<section class="panel" style="border-left:6px solid ${TR[t.trade].color}"><div class="panel-head"><h3>${esc(t.name)}</h3><span class="tag" style="--tc:${TR[t.trade].color}">${TR[t.trade].name}</span></div>
    <div class="statgrid" style="margin-top:4px"><div><span class="lab">Billed</span><span class="num">${money(s.b)}</span></div><div><span class="lab">Paid (time clock)</span><span class="num">${money(paid)}</span></div><div><span class="lab">Clocked hours</span><span class="num">${r1(ph)}</span></div></div>
    <div class="ratio">Bills <span class="num">${money(paid?s.b/paid:0,2)}</span> for every $1.00 you pay ${esc(first(t.name))}</div>
    <div class="statgrid"><div><span class="lab">Jobs</span><span class="num">${s.c}</span></div><div><span class="lab">Job hours</span><span class="num">${r1(s.h)}</span></div><div><span class="lab">Billable time</span><span class="num">${ph?pct(s.h/ph):'–'}</span></div>
    <div><span class="lab">Avg. ticket</span><span class="num">${s.c?money(s.b/s.c):'–'}</span></div><div><span class="lab">Parts cost</span><span class="num">${money(s.p)}</span></div><div><span class="lab">Job gross profit</span><span class="num ${g<0?'neg':''}">${money(g)}</span></div></div></section>`});
  h+=`<h2 style="margin-top:22px">By trade</h2><section class="panel" style="padding-top:6px"><div class="tablewrap"><table><thead><tr><th>Trade</th><th class="r">Jobs</th><th class="r">Billed</th><th class="r">Labor</th><th class="r">Parts</th><th class="r">Profit</th><th class="r">Margin</th></tr></thead><tbody>
  ${TK.map(k=>{const s=sum(js.filter(j=>j.trade===k)),g=s.b-s.l-s.p;return `<tr><td><span class="tag" style="--tc:${TR[k].color}">${TR[k].name}</span></td><td class="r">${s.c}</td><td class="r">${money(s.b)}</td><td class="r">${money(s.l)}</td><td class="r">${money(s.p)}</td><td class="r ${g<0?'neg':''}"><strong>${money(g)}</strong></td><td class="r">${s.b?pct(g/s.b):'–'}</td></tr>`}).join('')}</tbody></table></div></section>`;
  const unpaid=state.jobs.filter(j=>j.status==='invoiced').map(j=>{const due=addDays(j.invoice.date,TERMS[j.invoice.terms].d);return{j,due,late:daysBetween(due,today()),amt:balance(j)}}).sort((a,b)=>a.due.localeCompare(b.due)),owed=unpaid.reduce((s,u)=>s+u.amt,0);
  const pays=state.jobs.flatMap(j=>((j.invoice&&j.invoice.payments)||[]).filter(p=>p.date>=from)),byM={};pays.forEach(p=>{byM[p.method]=byM[p.method]||{n:0,a:0,f:0};byM[p.method].n++;byM[p.method].a+=p.amount;byM[p.method].f+=p.fee||0});
  const pTot=pays.reduce((x,p)=>x+p.amount,0),fTot=pays.reduce((x,p)=>x+(p.fee||0),0);
  h+=`<h2 style="margin-top:22px">Payments collected</h2><section class="panel" style="padding-top:6px"><div class="tablewrap"><table><thead><tr><th>Method</th><th class="r">Payments</th><th class="r">Collected</th><th class="r">Est. fees</th></tr></thead><tbody>${Object.entries(byM).sort((a,b)=>b[1].a-a[1].a).map(([k,v])=>`<tr><td>${esc(PM[k])}</td><td class="r">${v.n}</td><td class="r">${money(v.a)}</td><td class="r">${money(v.f)}</td></tr>`).join('')}</tbody></table></div><div class="total"><strong>Collected, last ${ui.period} days</strong><span class="num">${money(pTot)}</span></div><p class="sub small" style="margin-top:6px">Estimated processing fees: ${money(fTot)} (${pTot?pct(fTot/pTot):'0%'} of collections).</p></section>`;
  h+=`<h2 style="margin-top:22px">Unpaid invoices</h2><section class="panel" style="padding-top:6px">${unpaid.length?`<div class="tablewrap"><table><thead><tr><th>Customer</th><th>Terms</th><th>Due</th><th class="r">Amount</th></tr></thead><tbody>
  ${unpaid.map(u=>`<tr><td><button class="back" style="padding:0;color:var(--hvac)" data-act="open-invoice" data-id="${u.j.id}">${esc(cust(u.j.customerId).name)}</button></td><td>${TERMS[u.j.invoice.terms].l}</td><td>${u.late>0?`<span class="pill bad">${u.late} days late</span>`:fmtDate(u.due)}</td><td class="r">${money(u.amt,2)}</td></tr>`).join('')}
  </tbody></table></div><div class="total"><strong>Total outstanding</strong><span class="num">${money(owed,2)}</span></div>`:`<div class="empty">Every invoice is paid.</div>`}</section>`;
  const fu=state.followups.filter(f=>f.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8);
  h+=`<h2 style="margin-top:22px">Upcoming follow-ups</h2><section class="panel" style="padding-top:6px">${fu.length?`<div class="tablewrap"><table><thead><tr><th>Customer</th><th>Reminder</th><th>Send on</th></tr></thead><tbody>${fu.map(f=>`<tr><td>${esc(cust(f.customerId).name)}</td><td><span class="tag" style="--tc:${TR[f.trade].color}">${esc(f.label)}</span></td><td>${fmtDate(f.date)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No follow-ups scheduled.</div>`}</section>`;
  return h;
}

function recordPay(j,m,amt,ref){j.invoice.payments=j.invoice.payments||[];j.invoice.payments.push({id:uid('pay'),date:today(),method:m,amount:amt,ref,fee:cardFee(m,amt)});if(balance(j)<=0.004){j.status='paid';j.invoice.paidDate=today()}save()}
function shrinkLogo(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/png'))};im.onerror=()=>toast('That file could not be read as an image');im.src=r.result};r.readAsDataURL(file)}
function visitJob(m,v){const pl=planOf(m.planId),c=cust(v.cid),num=state.nextNum++;
  const units=Math.max(1,eqOf(c,'hvac',v.locId||undefined).filter(e=>!HVAC_SKIP.includes(e.type)).length);
  const tasks=v.tasks.map(t=>({id:t,qty:pb(t)&&pb(t).trade==='hvac'&&/tune-up/i.test(pb(t).name)?units:1,incl:true}));
  const hrs=tasks.reduce((x,l)=>x+(pb(l.id)?pb(l.id).hours*l.qty:0),0),date=v.due<today()?today():v.due;
  const j={id:'j'+num,num:'J-'+num,customerId:v.cid,locId:v.locId||null,trade:v.trade,techId:'',date,time:'08:00',dur:Math.min(8,Math.max(2,Math.ceil(hrs))),status:'scheduled',desc:shortPlan(pl)+' plan visit: '+v.label,locNote:'',tasks,hours:null,materials:[],checklist:CHECK[v.trade].map(()=>false),partsNeeded:'',invoice:null,summary:'',recs:'',notes:[{by:'Membership',text:`${pl.name} visit. Services listed are included at no charge. ${pl.discount}% off any added repairs. Record every piece of equipment you see.`,at:stamp()}]};
  state.jobs.push(j);v.jobId=j.id;save();return j}
function syncPv(){document.querySelectorAll('.sheet [data-pv]').forEach(i=>{const v=ui.sheet.visits[+i.dataset.pv];if(!v)return;if(i.dataset.pk==='task'){v.tasks=[i.value];v.trade=pb(i.value)?pb(i.value).trade:'hvac'}else if(i.dataset.pk==='mo')v.mo=+i.value;else v.label=i.value})}
function keepPlanFields(){const keep={};document.querySelectorAll('.sheet [data-g="pl"]').forEach(i=>keep[i.dataset.k]=i.value);const dg=$('#plDiag').checked;renderSheet();Object.entries(keep).forEach(([k,v])=>{const i=document.querySelector(`.sheet [data-g="pl"][data-k="${k}"]`);if(i)i.value=v});$('#plDiag').checked=dg}
function rsCheck(){const w=$('#rsWarn');if(!w)return;const cf=conflicts($('#rsTech').value,$('#rsDate').value,$('#rsTime').value,+$('#rsDur').value,ui.sheet.id);w.innerHTML=cf.length?`<div class="callout warn" style="margin-top:12px"><strong>Double booking:</strong> ${esc(first(tech($('#rsTech').value).name))} already has ${esc(conflictText(cf))}.</div>`:''}
function shrinkPhoto(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.7))};im.onerror=()=>toast('That file could not be read as a photo');im.src=r.result};r.readAsDataURL(file)}
const CHG={
  logo:el=>{const f=el.files&&el.files[0];if(!f)return;shrinkLogo(f,url=>{ui.sheet.logo=url;const pv=$('#logoPrev');pv.innerHTML=`<img src="${url}" alt="Logo preview">`})},
  memplan:el=>{ui.sheet.plan=el.value;renderSheet()},
  eqphoto:el=>{const f=el.files&&el.files[0];if(!f)return;const keep={};document.querySelectorAll('.sheet [data-g="eq"]').forEach(i=>keep[i.dataset.k]=i.value);shrinkPhoto(f,url=>{ui.sheet.photo=url;renderSheet();document.querySelectorAll('.sheet [data-g="eq"]').forEach(i=>{if(keep[i.dataset.k]!==undefined)i.value=keep[i.dataset.k]});toast('Photo added')})},
  rscheck:()=>{ui.sheet.okDouble=false;rsCheck()},
  me:el=>{ui.me=el.value;render()},
  check:el=>{job(el.dataset.id).checklist[+el.dataset.i]=el.checked;save();render()},
  hours:el=>{job(el.dataset.id).hours=el.value===''?null:Math.max(0,+el.value);save();render()},
  summary:el=>{job(el.dataset.id).summary=el.value;save()},
  recs:el=>{job(el.dataset.id).recs=el.value;save()},
  terms:el=>{job(el.dataset.id).invoice.terms=el.value;save();render()},
  mats:el=>{job(el.dataset.id).invoice.showMaterials=el.checked;save();render()},
  eta:el=>{ui.sheet.eta=+el.value;$('#omwPrev').firstChild.textContent=omwText(job(el.dataset.id),+el.value)},
  icust:el=>{syncIntake();intake.customerId=el.value;intake.site={};render()}
};
const INP={
  payamt:el=>{const a=parseFloat(el.value),f=cardFee(ui.sheet.m,isFinite(a)?a:0);const p=document.querySelector('.sheet .sub.small strong');if(p&&f)p.textContent=money(f,2)},
  pickq:el=>{ui.sheet.q=el.value;$('#picklist').innerHTML=pickList()},
  ipq:el=>{ui.sheet.q=el.value;$('#iplist').innerHTML=invPickList()},
  invq:el=>{ui.invQ=el.value;$('#invlist').innerHTML=invList()},
  custq:el=>{ui.custQ=el.value;$('#custlist').innerHTML=custList()},
  pb:()=>pbSuggest(),
  summary:el=>{job(el.dataset.id).summary=el.value;save()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f)f(el,el.dataset.id,e)});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.g&&intake)intake.okDouble=false;if(el.dataset&&el.dataset.chg&&CHG[el.dataset.chg])CHG[el.dataset.chg](el,e)});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.chg==='summary')INP.summary(el);if(el.dataset&&el.dataset.chg==='recs')CHG.recs(el);if(el.dataset&&el.dataset.inp&&INP[el.dataset.inp])INP[el.dataset.inp](el,e)});
let dragId=null,dragOff=0;
document.addEventListener('dragstart',e=>{const b=e.target.closest&&e.target.closest('[data-drag]');if(!b)return;dragId=b.dataset.drag;dragOff=e.clientY-b.getBoundingClientRect().top;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(x){}b.classList.add('dragging')});
document.addEventListener('dragend',e=>{document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'))});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.bcol');if(!c||!dragId)return;e.preventDefault();document.querySelectorAll('.bcol.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('.bcol');if(!c||!dragId)return;e.preventDefault();const j=job(dragId);dragId=null;if(!j)return;
  const y=e.clientY-c.getBoundingClientRect().top-dragOff,dur=Math.round((j.dur||3)*60);let m=BS*60+Math.round(y/PX*2)*30;m=Math.max(BS*60,Math.min(BE*60-30,m));
  const tid=c.dataset.col,date=ui.day||today(),cf=conflicts(tid,date,fromMin(m),dur/60,j.id);
  j.techId=tid;j.time=fromMin(m);j.date=date;if(j.status==='enroute')j.status='scheduled';save();render();
  toast(cf.length?`Moved, but ${first(tech(tid).name)} is now double booked with ${cust(cf[0].customerId).name}`:`Moved to ${tid?first(tech(tid).name):'Unassigned'} at ${fmtTimePlain(fromMin(m))}`)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet)closeSheet()});
setInterval(()=>{if(view.name==='clock'&&!ui.sheet)render()},60000);

load();render();
</script>
</body>
